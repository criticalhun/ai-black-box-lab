experiment: EXP021
hypothesis: H023

task:
  name: modular_addition
  p: 113                 # prím; tokenek 0..112 = számok, 113 = "="
  train_fraction: 0.3
  data_seed: 101         # EXP021: ÚJ felosztás (H023, H024)

model:
  n_layers: 1
  d_model: 128
  n_heads: 4
  d_head: 32
  d_mlp: 512
  activation: relu
  layernorm: false
  attn_bias: false
  mlp_bias: true
  causal_mask: true
  n_ctx: 3               # [a, b, =]
  d_vocab: 114           # 113 szám + "="
  init: normal_std_1_over_sqrt_d_model   # bias-ok: 0

training:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0
  betas: [0.9, 0.98]
  warmup_steps: 10       # lineáris warmup
  max_steps: 40000
  batch: full            # a teljes train halmaz minden lépésben
  loss_position: -1      # csak az utolsó pozíció ("=") kimenetén
  loss_dtype: float64    # log-softmax float64-ben (a ~0 loss float32-ben instabil)

seeds: [0, 1, 2]         # modell-inicializálás

runtime:
  device: cuda
  dtype: float32

reproducibility:
  deterministic: true                  # torch.use_deterministic_algorithms(True)
  cublas_workspace_config: ":4096:8"   # CUBLAS determinizmushoz szükséges
  float32_matmul_precision: highest    # TF32 tiltva
  determinism_check: seed 0 kétszer futtatva → végső súly-hash és metrics.csv bit-pontosan egyezik

logging:
  log_every: 100         # train/test loss + acc → CSV
  checkpoint_every: 1000 # modell state_dict → .pt (gitben nincs)
