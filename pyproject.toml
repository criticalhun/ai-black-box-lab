[project]
name = "ai-black-box-lab"
version = "0.1.0"
description = "Mechanistic interpretability research lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
]

# CUDA 13.0 PyTorch build (fedora desktop: RTX 4060, driver 615.x)
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
